<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Кубик Рубіка 3D PRO</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#529b89">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg-gradient: linear-gradient(180deg, #529b89 0%, #3d796a 100%);
            --bg-panel: rgba(20, 20, 30, 0.9);
            --bg-topbar: rgba(20, 20, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f0f0f5;
            --btn-bg: #272736;
            --btn-hover: #3a3a52;
        }

        html {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }

        body { 
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden; 
            background: var(--bg-gradient); 
            font-family: system-ui, -apple-system, sans-serif; 
            color: var(--text-color); 
            height: 100%;
            width: 100%;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }

        #canvas-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; 
            opacity: 0; 
            transition: opacity 0.15s ease-out;
            touch-action: none;
            background: #529b89;
        }
        #canvas-container.loaded { opacity: 1; }
        
        #top-bar { 
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 10; 
            background: var(--bg-topbar); padding: 4px 12px; border-radius: 30px; 
            border: 1px solid var(--border-color); backdrop-filter: blur(15px); 
            display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            touch-action: none;
        }
        .stat-badge { font-size: 12px; font-weight: 600; white-space: nowrap; }
        .stat-badge span { color: #00d2ff; font-size: 13px; }

        .sound-btn {
            background: none; border: none; color: var(--text-color); font-size: 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 2px 4px; border-radius: 50%; transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .sound-btn:hover { transform: scale(1.15); }
        .sound-btn.muted { opacity: 0.5; }

        .theme-dots { display: flex; gap: 5px; align-items: center; }
        .theme-dot {
            width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s ease;
        }
        .theme-dot.active { border-color: #fff; transform: scale(1.1); }

        #controls-panel { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 10; 
            width: 100%; max-width: 100%; background: var(--bg-panel); 
            border-top: 1px solid var(--border-color); padding: 12px 10px 15px 10px; backdrop-filter: blur(20px); 
            box-shadow: 0 -5px 30px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 8px; 
            border-radius: 20px 20px 0 0;
            touch-action: none;
        }

        .algo-header-wrapper { display: flex; align-items: center; gap: 8px; width: 100%; }

        .help-btn {
            background: #f39c12; color: #fff; border: none; width: 32px; height: 32px;
            border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: all 0.2s ease;
        }
        .help-btn:hover { background: #f1c40f; transform: scale(1.05); }
        .help-btn.active { background: #00d2ff; color: #141420; box-shadow: 0 0 10px #00d2ff; }

        #algo-display {
            flex-grow: 1; background: #15151e; padding: 6px; border-radius: 8px; text-align: center;
            font-family: monospace; font-size: 14px; color: #ffcc00; font-weight: bold;
            border: 1px solid rgba(255,255,255,0.05); min-height: 32px; 
            display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; line-height: 1.2;
        }
        
        .algo-step { padding: 2px 4px; border-radius: 3px; transition: all 0.15s ease; color: #ffcc00; }
        .algo-step.current { background: #c0392b; color: #ffffff; transform: scale(1.15); box-shadow: 0 0 5px #c0392b; }
        .algo-step.done { color: #555566; }
        
        .button-group { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
        
        button.move-btn { 
            background: var(--btn-bg); border: none; color: #fff; 
            padding: 8px 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; 
            transition: all 0.1s ease; text-align: center;
            touch-action: manipulation;
        }
        button.move-btn:hover { background: var(--btn-hover); }
        /* ========== ЗБІЛЬШЕННЯ ШТРИХІВ НА КНОПКАХ ========== */
        button.move-btn span { 
            font-size: 2em; 
            font-weight: 900; 
            color: #ff7700; 
            text-shadow: 0 0 8px rgba(255, 119, 0, 0.5);
        }

        .mode-wrapper { display: flex; background: #1e1e2a; border-radius: 8px; padding: 2px; border: 1px solid rgba(255,255,255,0.05); }
        .mode-toggle {
            flex: 1; text-align: center; padding: 6px 0; font-size: 13px; font-weight: 700; 
            cursor: pointer; border-radius: 6px; transition: all 0.1s ease; color: #e0e0e5;
            touch-action: manipulation;
        }
        .mode-toggle.active { background: #1e8449; color: #fff; box-shadow: 0 0 8px rgba(30, 132, 73, 0.5); }

        .alg-select-wrapper { position: relative; width: 100%; }
        .alg-select {
            width: 100%; background: #1e8449; color: #fff; border: none; 
            padding: 8px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; 
            cursor: pointer; appearance: none; -webkit-appearance: none; outline: none; text-align: center;
            touch-action: manipulation;
        }
        .alg-select:hover { background: #229954; }
        .alg-select-wrapper::after {
            content: '▼'; font-size: 7px; color: white; position: absolute; right: 12px; top: 13px; pointer-events: none;
        }

        .fx-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .action-btn { background: #1a5276; color: #fff; border: none; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; touch-action: manipulation; }
        .action-btn:hover { background: #1f618d; }
        .pro-btn { background: #d68910; color: #fff; border: none; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; touch-action: manipulation; }
        .pro-btn:hover { background: #e67e22; }
        .danger-btn { background: #922b21; color: #fff; border: none; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: opacity 0.2s ease; touch-action: manipulation; }
        .danger-btn:hover { background: #a93226; }

        #pro-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 100; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
            touch-action: none;
        }
        .modal-content {
            background: #1e1e2a; padding: 24px; border-radius: 16px; text-align: center;
            max-width: 340px; width: 90%; color: #fff; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-content h3 { color: #f1c40f; font-size: 20px; margin-bottom: 8px; }
        .modal-content p { font-size: 13px; color: #a0a0ab; margin-bottom: 12px; line-height: 1.4; }

        .plan-selector { display: flex; gap: 8px; margin-bottom: 14px; }
        .plan-card {
            flex: 1; background: #141420; border: 2px solid #3a3a52; border-radius: 10px;
            padding: 8px; cursor: pointer; transition: all 0.2s ease;
        }
        .plan-card.active { border-color: #f1c40f; background: rgba(241, 196, 15, 0.08); }
        .plan-title { font-size: 12px; color: #a0a0ab; font-weight: 600; }
        .plan-price { font-size: 15px; color: #fff; font-weight: bold; margin-top: 2px; }
        .plan-badge { font-size: 9px; color: #2ecc71; font-weight: bold; text-transform: uppercase; margin-top: 2px; }

        .modal-input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #3a3a52;
            margin-bottom: 12px; background: #09090e; color: #fff; text-align: center;
            font-family: monospace; font-size: 13px; outline: none;
        }
        .modal-btn-confirm {
            width: 100%; background: #27ae60; color: #fff; border: none; padding: 10px;
            border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s;
        }
        .modal-btn-confirm:hover { background: #2ecc71; }
        .buy-link {
            display: block; margin-top: 10px; color: #00d2ff; font-size: 13px; font-weight: bold;
            text-decoration: none; padding: 10px; border-radius: 6px; background: rgba(0, 210, 255, 0.1);
            cursor: pointer;
        }
        .buy-link:hover { background: rgba(0, 210, 255, 0.2); }
        .close-modal-btn { background: transparent; color: #a0a0ab; border: none; font-size: 12px; margin-top: 10px; cursor: pointer; }
    </style>

    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="top-bar">
        <div class="stat-badge">Moves: <span id="counter">0</span></div>
        <button id="sound-btn" class="sound-btn" onclick="toggleSound()" title="Sound On/Off">🔊</button>
        <div class="theme-dots">
            <div class="theme-dot" style="background: #09090e;" onclick="switchTheme('dark', this)"></div>
            <div class="theme-dot active" style="background: #529b89;" onclick="switchTheme('mint', this)"></div>
            <div class="theme-dot" style="background: #142824;" onclick="switchTheme('teal', this)"></div>
        </div>
    </div>

    <div id="controls-panel">
        <div class="algo-header-wrapper">
            <button id="help-btn" class="help-btn" onclick="toggleFaceLabels()" title="Show Labels">?</button>
            <div id="algo-display">Choose combination...</div>
        </div>

        <div class="button-group">
            <button class="move-btn" onclick="handleMove('U')">U</button>
            <button class="move-btn" onclick="handleMove('U\'')">U<span>'</span></button>
            <button class="move-btn" onclick="handleMove('D')">D</button>
            <button class="move-btn" onclick="handleMove('D\'')">D<span>'</span></button>
            <button class="move-btn" onclick="handleMove('F')">F</button>
            <button class="move-btn" onclick="handleMove('F\'')">F<span>'</span></button>
        </div>
        <div class="button-group">
            <button class="move-btn" onclick="handleMove('B')">B</button>
            <button class="move-btn" onclick="handleMove('B\'')">B<span>'</span></button>
            <button class="move-btn" onclick="handleMove('R')">R</button>
            <button class="move-btn" onclick="handleMove('R\'')">R<span>'</span></button>
            <button class="move-btn" onclick="handleMove('L')">L</button>
            <button class="move-btn" onclick="handleMove('L\'')">L<span>'</span></button>
        </div>

        <div class="mode-wrapper">
            <div id="mode-manual" class="mode-toggle active" onclick="setMode('manual')">Manual</div>
            <div id="mode-auto" class="mode-toggle" onclick="setMode('auto')">Auto</div>

        <div class="alg-select-wrapper">

                    <option value="R U2 R' U' R U' R'">🔒 Anti-Sune OLL</option>

                    <option value="F R U' R' U' R U R' F' R U R' U' R' F R F'">🔒 Y-Permutation</option>
                    <option value="R' F R' B2 R F' R' B2 R2">🔒 A-Permutation</option>
                    <option value="R U' R U R U R U' R' U' R2">🔒 Ua-Permutation</option>
                    <option value="R2 U R U R' U' R' U' R' U R'">🔒 Ub-Permutation</option>
                    <option value="R' U R' U' R D' R' D R' U2 R D' R' D R2">🔒 E-Permutation</option>
                    <option value="R U R' U' R' F R2 U' R' U' R U R' F'">🔒 T-Permutation</option>
                </optgroup>
                <optgroup label="🧔 PRO: Creative Art & Patterns">
                    <option value="F R U R' U' F' R U R' U' R' F R F'">🔒 Cube in a Cube</option>
                    <option value="U F B' R2 B2 L2 U' D' R2 F R' L B2 U' F2 B R2 D' F2 U2">🔒 Dot Pattern</option>
                    <option value="R L U2 R' L' U2">🔒 Snake Pattern</option>
                    <option value="F2 R2 F2 R2 F2 R2">🔒 Stripes / Banded Pattern</option>
                    <option value="U2 R2 U2 L2 U2 F2 U2 B2">🔒 Double Cross Pattern</option>
                    <option value="R U2 L' D2 R' U2 L D2">🔒 Nested Cube Pattern</option>
                </optgroup>
            </select>
        </div>

        <div class="fx-group">
            <button class="action-btn" onclick="triggerScramble()">🔀 Scramble</button>
            <button id="pro-status-btn" class="pro-btn" onclick="openActivationModal()">🔑 PRO</button>
            <button id="reset-btn" class="danger-btn" onclick="triggerReset()">⟳ Reset</button>
        </div>
    </div>

    <div id="pro-modal">
        <div class="modal-content">
            <h3>🏆 LogixCube PRO</h3>
            <p>Select subscription plan or enter your license key:</p>
            <div class="plan-selector">
                <div id="plan-monthly" class="plan-card active" onclick="selectPlan('monthly')">

                <div id="plan-yearly" class="plan-card" onclick="selectPlan('yearly')">

            <button class="modal-btn-confirm" onclick="validateLicense()">Activate PRO</button>
            <a id="buy-btn-link" onclick="openSelectedCheckout()" class="buy-link">🛒 Subscribe for $4.99 / mo</a>
            <br>
            <button class="close-modal-btn" onclick="closeActivationModal()">Close</button>
        </div>
    </div>

    <script>
        // ========== ОБРОБКА ПОМИЛОК ЗАВАНТАЖЕННЯ ==========
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'SCRIPT') {
                console.warn('⚠️ Помилка завантаження скрипта:', e.target.src);
                document.body.innerHTML += `
                    <div style="position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#c0392b; color:#fff; padding:10px 20px; border-radius:8px; z-index:999; font-size:14px; text-align:center; max-width:90%;">
                        ⚠️ Помилка завантаження 3D-движка. Перевірте підключення до інтернету.
                    </div>
                `;
            }
        }, true);

        // ========== ЗАХИЩЕНИЙ АДМІН-КЛЮЧ ==========
        const ENCODED_ADMIN_KEY = [
            79, 82, 74, 76, 91, 48, 68, 71, 80, 76, 81, 48, 53, 51, 53, 57, 48, 86, 72, 70, 85, 72, 87
        ];
        function decodeAdminKey() {
            return String.fromCharCode(...ENCODED_ADMIN_KEY.map(c => c - 3));
        }
        const ADMIN_MASTER_KEY = decodeAdminKey();

        const FREE_ALGORITHMS = [
            "R U R' U'", "L' U' L U", "R' F R F'", "R U R' U R U2 R'", "U R U' L' U R' U' L"
        ];

        const COLORS = { 
            U: '#fffb00', D: '#ffffff', R: '#00ff66', 
            L: '#0066ff', F: '#ff0055', B: '#ff7700'
        };
        
        // ========== ТЕМИ З КОЛЬОРОМ ДЛЯ РЕНДЕРЕРА ==========
        const THEMES = {
            dark: { 
                gradient: 'linear-gradient(135deg, #09090e 0%, #141420 100%)',
                clearColor: 0x09090e 
            },
            mint: { 
                gradient: 'linear-gradient(180deg, #529b89 0%, #3d796a 100%)',
                clearColor: 0x529b89 
            },
            teal: { 
                gradient: 'linear-gradient(135deg, #142824 0%, #0a1412 100%)',
                clearColor: 0x142824 
            }
        };

        const STORE_URLS = {
            monthly: "https://logixcube.lemonsqueezy.com/checkout/buy/a9c73a40-c798-4914-8682-1c4ca210f04f",
            yearly: "https://logixcube.lemonsqueezy.com/checkout/buy/e5280fde-1c68-4504-8c23-22d464aff311"
        };

        let scene, camera, renderer, controls, cubies = [];
        let moveQueue = [];
        let historyMoves = [];
        let isAnimating = false;
        let isRestoring = false;
        let isScrambling = false;
        let moveCount = 0;
        let currentMode = 'manual';
        let isMuted = false;
        let isProUser = false; 
        let storedAlgoStr = ""; 
        let activeAlgoSteps = [];
        let currentStepIndex = -1;
        let animFrameId = null;
        
        let faceLabelsGroup = new THREE.Group();
        let showLabels = false;

        const pivot = new THREE.Group();
        
        const CUBIE_SIZE = 0.98; 
        const PLASTIC_COLOR = '#2b2b32'; 

        // ========== ФУНКЦІЯ МАЛЮВАННЯ ЗАКРУГЛЕНИХ ПРЯМОКУТНИКІВ (без roundRect) ==========
        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function createFaceTexture(hexColor) {
            const canvas = document.createElement('canvas'); 
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d'); 
            ctx.fillStyle = PLASTIC_COLOR; 
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = hexColor;
            drawRoundedRect(ctx, 12, 12, 232, 232, 28);
            ctx.fill();
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function createXeroxLogoTexture(hexColor) {
            const canvas = document.createElement('canvas'); 
            canvas.width = 128; 
            canvas.height = 128;
            const ctx = canvas.getContext('2d'); 
            
            ctx.fillStyle = PLASTIC_COLOR; 
            ctx.fillRect(0, 0, 128, 128);
            
            ctx.fillStyle = hexColor; 
            drawRoundedRect(ctx, 7, 7, 114, 114, 16);
            ctx.fill();
            
            ctx.fillStyle = '#c0392b';
            
            ctx.beginPath(); ctx.moveTo(32, 25); ctx.lineTo(46, 25); ctx.lineTo(64, 49); ctx.lineTo(50, 49); ctx.fill();
            ctx.beginPath(); ctx.moveTo(96, 25); ctx.lineTo(82, 25); ctx.lineTo(64, 49); ctx.lineTo(78, 49); ctx.fill();
            ctx.beginPath(); ctx.moveTo(32, 79); ctx.lineTo(46, 79); ctx.lineTo(64, 55); ctx.lineTo(50, 55); ctx.fill();
            ctx.beginPath(); ctx.moveTo(96, 79); ctx.lineTo(82, 79); ctx.lineTo(64, 55); ctx.lineTo(78, 55); ctx.fill();
            
            ctx.strokeStyle = '#141420';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(36, 52); ctx.lineTo(92, 52); ctx.stroke();
            
            ctx.fillStyle = '#141420';
            ctx.font = '900 9px "Courier New", monospace, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const text = "LOGIXCUBE";
            ctx.fillText(text.split('').join(' '), 64, 102); 
            
            return new THREE.CanvasTexture(canvas);
        }

        function createLabelSprite(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(20, 20, 30, 0.85)';
            ctx.beginPath(); ctx.arc(64, 64, 50, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 6; ctx.strokeStyle = color; ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 55px system-ui, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 66);

            const spriteMaterial = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(0.8, 0.8, 0.8);
            return sprite;
        }

        function setupFaceLabels() {
            scene.remove(faceLabelsGroup);
            faceLabelsGroup = new THREE.Group();

            const labelData = [
                { text: 'U', pos: new THREE.Vector3(0, 2.1, 0), color: COLORS.U },
                { text: 'D', pos: new THREE.Vector3(0, -2.1, 0), color: COLORS.D },
                { text: 'R', pos: new THREE.Vector3(2.1, 0, 0), color: COLORS.R },
                { text: 'L', pos: new THREE.Vector3(-2.1, 0, 0), color: COLORS.L },
                { text: 'F', pos: new THREE.Vector3(0, 0, 2.1), color: COLORS.F },
                { text: 'B', pos: new THREE.Vector3(0, 0, -2.1), color: COLORS.B }
            ];

            labelData.forEach(item => {
                const sprite = createLabelSprite(item.text, item.color);
                sprite.position.copy(item.pos);
                faceLabelsGroup.add(sprite);
            });

        }

        function buildCube() {
            cubies.forEach(c => scene.remove(c)); 
            cubies = [];
            
            const geom = new THREE.BoxGeometry(CUBIE_SIZE, CUBIE_SIZE, CUBIE_SIZE);
            const internalMat = new THREE.MeshLambertMaterial({ color: PLASTIC_COLOR, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });

            const materials = {
                R: new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.R), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
                L: new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.L), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
                U: new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.U), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
                D: new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.D), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
                D_Logo: new THREE.MeshLambertMaterial({ map: createXeroxLogoTexture(COLORS.D), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
                F: new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.F), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
                B: new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.B), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
            };

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        if (x === 0 && y === 0 && z === 0) continue; 
                        
                        const isWhiteCenter = (x === 0 && y === -1 && z === 0);
                        
                        const mats = [
                            x === 1 ? materials.R : internalMat,  
                            x === -1 ? materials.L : internalMat, 
                            y === 1 ? materials.U : internalMat,  
                            y === -1 ? (isWhiteCenter ? materials.D_Logo : materials.D) : internalMat, 
                            z === 1 ? materials.F : internalMat,  
                            z === -1 ? materials.B : internalMat  
                        ];
                        
                        const mesh = new THREE.Mesh(geom, mats); 
                        mesh.position.set(x, y, z);
                        scene.add(mesh); 
                        cubies.push(mesh);
                    }
                }
            }
            setupFaceLabels();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (!isAnimating && moveQueue.length > 0 && !isRestoring) {
                if (activeAlgoSteps.length > 0 && currentMode === 'auto') {
                    currentStepIndex++;
                    updateAlgoHighlight();
                }
                const nextMove = moveQueue.shift();
                historyMoves.push(nextMove);
                if (!isScrambling) {
                    moveCount++;
                    document.getElementById('counter').innerText = moveCount;
                }
                saveState();
                executeMove(nextMove);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        function getLayerCubies(face) {
            return cubies.filter(c => {
                if (face === 'R') return c.position.x > 0.5;
                if (face === 'L') return c.position.x < -0.5;
                if (face === 'U') return c.position.y > 0.5;
                if (face === 'D') return c.position.y < -0.5;
                if (face === 'F') return c.position.z > 0.5;
                if (face === 'B') return c.position.z < -0.5;
                return false;
            });
        }

        function executeInstantMove(moveStr) {
            const isPrime = moveStr.includes("'");
            const isDouble = moveStr.includes("2");
            const face = moveStr[0];
            const layer = getLayerCubies(face);

            pivot.position.set(0, 0, 0); 
            pivot.rotation.set(0, 0, 0);
            pivot.updateMatrixWorld();

            layer.forEach(c => pivot.attach(c));

            let angle = Math.PI / 2;
            if (face === 'R' || face === 'U' || face === 'F') angle = -angle;
            if (isPrime) angle = -angle;
            if (isDouble) angle = angle * 2;

            if (face === 'R' || face === 'L') pivot.rotation.x = angle;
            if (face === 'U' || face === 'D') pivot.rotation.y = angle;
            if (face === 'F' || face === 'B') pivot.rotation.z = angle;

            pivot.updateMatrixWorld();
            const tempArray = [...pivot.children];
            tempArray.forEach(c => {
                scene.attach(c);
                c.position.x = Math.round(c.position.x);
                c.position.y = Math.round(c.position.y);
                c.position.z = Math.round(c.position.z);
                
                c.rotation.x = Math.round(c.rotation.x / (Math.PI / 2)) * (Math.PI / 2);
                c.rotation.y = Math.round(c.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
                c.rotation.z = Math.round(c.rotation.z / (Math.PI / 2)) * (Math.PI / 2);
            });
        }

        function executeMove(moveStr) {
            isAnimating = true;
            updateResetButtonState();
            playClickSound();

            const isPrime = moveStr.includes("'");
            const isDouble = moveStr.includes("2");
            const face = moveStr[0];
            const layer = getLayerCubies(face);

            pivot.position.set(0, 0, 0); 
            pivot.rotation.set(0, 0, 0);
            pivot.updateMatrixWorld();

            layer.forEach(c => pivot.attach(c));

            let angle = Math.PI / 2;
            if (face === 'R' || face === 'U' || face === 'F') angle = -angle;
            if (isPrime) angle = -angle;
            if (isDouble) angle = angle * 2;

            let currentProgress = 0;
            let duration = (isScrambling || currentMode === 'auto') ? 38 : (moveQueue.length > 2 ? 12 : 25);

            function animateRotation() {
                currentProgress++;
                const step = angle / duration;
                
                if (face === 'R' || face === 'L') pivot.rotation.x += step;
                if (face === 'U' || face === 'D') pivot.rotation.y += step;
                if (face === 'F' || face === 'B') pivot.rotation.z += step;

                if (currentProgress < duration) {
                    animFrameId = requestAnimationFrame(animateRotation);
                } else {
                    pivot.updateMatrixWorld();
                    const tempArray = [...pivot.children];
                    tempArray.forEach(c => {
                        scene.attach(c);
                        c.position.x = Math.round(c.position.x);
                        c.position.y = Math.round(c.position.y);
                        c.position.z = Math.round(c.position.z);
                        
                        c.rotation.x = Math.round(c.rotation.x / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.y = Math.round(c.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.z = Math.round(c.rotation.z / (Math.PI / 2)) * (Math.PI / 2);
                    });
                    
                    isAnimating = false;
                    animFrameId = null;
                    if (isScrambling && moveQueue.length === 0) isScrambling = false;
                    updateResetButtonState();
                }
            }
            animFrameId = requestAnimationFrame(animateRotation);
        }

        function updateAlgoHighlight() {
            if (activeAlgoSteps.length === 0) return;
            const container = document.getElementById('algo-display');
            let html = '';
            activeAlgoSteps.forEach((step, idx) => {
                let cls = 'algo-step';
                if (idx === currentStepIndex) cls += ' current';
                if (idx < currentStepIndex) cls += ' done';
                html += `<span class="${cls}">${step}</span>`;
            });
            container.innerHTML = html;
        }

            document.querySelectorAll('.mode-toggle').forEach(el => el.classList.remove('active'));
            document.getElementById(mode === 'auto' ? 'mode-auto' : 'mode-manual').classList.add('active');
            
            if (mode === 'auto') {
                if (storedAlgoStr) {
                    if (!isRestoring) {
                        moveQueue = []; 
                        currentStepIndex = -1;
                        activeAlgoSteps = storedAlgoStr.split(' ');
                        updateAlgoHighlight();
                        activeAlgoSteps.forEach(step => moveQueue.push(step));
                    }
                }
            } else {
                moveQueue = [];
                if (storedAlgoStr) {
                    currentStepIndex = -1;
                    document.getElementById('algo-display').innerHTML = activeAlgoSteps.map(step => `<span class="algo-step">${step}</span>`).join('');
                }
            }

        function triggerScramble() {
            isScrambling = true;
            updateResetButtonState();
            const moves = ['U', 'D', 'R', 'L', 'F', 'B', "U'", "D'", "R'", "L'", "F'", "B'"];
            for (let i = 0; i < 20; i++) {
                moveQueue.push(moves[Math.floor(Math.random() * moves.length)]);
            }
        }

        function triggerReset() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }

            while (pivot.children.length > 0) {
                scene.attach(pivot.children[0]);
            }
            
            pivot.rotation.set(0, 0, 0);
            pivot.position.set(0, 0, 0);

            moveQueue = []; historyMoves = []; activeAlgoSteps = [];
            currentStepIndex = -1; isAnimating = false; isScrambling = false; moveCount = 0; storedAlgoStr = "";
            localStorage.removeItem('rubik_cube_save_data');
            document.getElementById('counter').innerText = '0';
            document.getElementById('algo-display').innerText = "Choose combination...";
            buildCube();
            if (controls) controls.target.set(0, -1.2, 0);
            updateResetButtonState();
        }

        function saveState() {
            localStorage.setItem('rubik_cube_save_data', JSON.stringify({
                historyMoves: historyMoves,
                moveCount: moveCount,
                storedAlgoStr: storedAlgoStr,
                currentMode: currentMode
            }));
        }

        function loadSavedStateSync() {
            const savedRaw = localStorage.getItem('rubik_cube_save_data');
            if (!savedRaw) return;

            try {
                const data = JSON.parse(savedRaw);
                if (data.historyMoves && data.historyMoves.length > 0) {
                    isRestoring = true;
                    historyMoves = [...data.historyMoves];
                    moveCount = data.moveCount || 0;
                    document.getElementById('counter').innerText = moveCount;

                    if (data.storedAlgoStr) {
                        storedAlgoStr = data.storedAlgoStr;
                        activeAlgoSteps = storedAlgoStr.split(' ');
                        document.getElementById('algo-display').innerHTML = activeAlgoSteps.map(step => `<span class="algo-step">${step}</span>`).join('');
                    }

                    // Встановлюємо режим, але НЕ викликаємо setMode, щоб не заповнювати чергу
                    if (data.currentMode) {
                        currentMode = data.currentMode;
                        document.querySelectorAll('.mode-toggle').forEach(el => el.classList.remove('active'));
                        document.getElementById(data.currentMode === 'auto' ? 'mode-auto' : 'mode-manual').classList.add('active');
                    }

                    // Виконуємо всі збережені ходи (миттєво, без анімації)
                    historyMoves.forEach(move => executeInstantMove(move));
                    
                    isRestoring = false;
                } else {
                    // Якщо historyMoves порожній, але є збережений режим – відновлюємо його без заповнення черги
                    if (data.currentMode) {
                        currentMode = data.currentMode;
                        document.querySelectorAll('.mode-toggle').forEach(el => el.classList.remove('active'));
                        document.getElementById(data.currentMode === 'auto' ? 'mode-auto' : 'mode-manual').classList.add('active');
                    }
                    if (data.storedAlgoStr) {
                        storedAlgoStr = data.storedAlgoStr;
                        activeAlgoSteps = storedAlgoStr.split(' ');
                        document.getElementById('algo-display').innerHTML = activeAlgoSteps.map(step => `<span class="algo-step">${step}</span>`).join('');
                    }
                    moveCount = data.moveCount || 0;
                    document.getElementById('counter').innerText = moveCount;
                    isRestoring = false;
                }
            } catch (err) {
                isRestoring = false;
            }
        }

        async function checkProStatus() {
            const saved = localStorage.getItem('rubik_license_data');
            if (!saved) return;

            try {
                const data = JSON.parse(saved);
                if (data.type === 'admin') {
                    const elapsed = Date.now() - data.activatedAt;
                    const twoHours = 2 * 60 * 60 * 1000;
                    if (elapsed > twoHours) {
                        localStorage.removeItem('rubik_license_data');
                        isProUser = false;
                        updateProUI();
                        return;
                    } else {
                        isProUser = true;
                        updateProUI();
                        return;
                    }
                }

                if (data.type === 'license') {
                    const key = data.key;
                    try {
                        const response = await fetch('https://api.lemonsqueezy.com/v1/licenses/validate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: new URLSearchParams({ 
                                license_key: key,
                                instance_id: window.location.hostname 
                            })
                        });
                        const result = await response.json();
                        if (result.valid && result.meta && result.meta.status !== 'disabled' && result.meta.status !== 'expired') {
                            isProUser = true;
                            updateProUI();
                        } else {
                            localStorage.removeItem('rubik_license_data');
                            isProUser = false;
                            updateProUI();
                        }
                    } catch (err) {
                        isProUser = false;
                        updateProUI();
                    }
                }
            } catch (e) {
                localStorage.removeItem('rubik_license_data');
                isProUser = false;
                updateProUI();
            }
        }

                return;
            }
            storedAlgoStr = algoStr;
            activeAlgoSteps = algoStr.split(' ');
            currentStepIndex = -1;
            const container = document.getElementById('algo-display');
            container.innerHTML = activeAlgoSteps.map(step => `<span class="algo-step">${step}</span>`).join('');
            moveQueue = []; 
            if (currentMode === 'auto') {
                moveQueue = [...activeAlgoSteps];
                currentStepIndex = -1;
                updateAlgoHighlight();
            }
            saveState();
        }

        // ========== ЗВУК ==========
        function toggleSound() {
            isMuted = !isMuted;
            const btn = document.getElementById('sound-btn');
            btn.innerText = isMuted ? '🔇' : '🔊';
            btn.classList.toggle('muted', isMuted);
        }

        let audioCtx = null;
        function playClickSound() {
            if (isRestoring || isMuted) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;
                const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.08), audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(2100, now);
                noiseFilter.Q.setValueAtTime(1.8, now);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.06, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);
            } catch (e) {}
        }

        // ========== РЕЄСТРАЦІЯ SERVICE WORKER ==========
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('✅ Service Worker зареєстровано'))
                .catch(err => console.error('❌ Помилка реєстрації SW:', err));
        }

        // ========== ЗАПУСК ==========
        window.onload = init3D;
    </script>
</body>
</html>
