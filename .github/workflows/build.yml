name: Build Android AAB

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r *.html *.js *.json *.png icons js locales www/ 2>/dev/null || true

      - name: Build Android
        run: |
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/versionCode 1/versionCode 9/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.2"/g' android/app/build.gradle
          sed -i 's/dependencies {/dependencies {\n    implementation "com.android.billingclient:billing:8.0.0"/g' android/app/build.gradle
          cd android
           cp ../release.keystore release.keystore
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$(pwd)/release.keystore -Pandroid.injected.signing.store.password=123456 -Pandroid.injected.signing.key.alias=mykey -Pandroid.injected.signing.key.password=123456

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/release.keystore
